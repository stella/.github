name: "Package Publisher Check"
description: "Reject workspace packages published from another repository"

inputs:
  root:
    description: "Repository root containing package.json"
    required: false
    default: "."
  registry-url:
    description: "npm registry base URL"
    required: false
    default: "https://registry.npmjs.org"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "22.21.1"

    - name: Check package publishers
      shell: bash
      env:
        NPM_REGISTRY_URL: ${{ inputs.registry-url }}
      run: node "${{ github.action_path }}/../../.github/tools/package-publisher-check.mjs" --root "${{ inputs.root }}"
