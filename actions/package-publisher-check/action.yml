name: "Package Publisher Check"
description: "Reject workspace packages published from another repository"

inputs:
  root:
    description: "Repository root containing package.json"
    required: false
    default: "."
  registry-url:
    description: "npm registry base URL"
    required: false
    default: "https://registry.npmjs.org"
  package-files:
    description: "Newline-separated package.json files to inspect instead of discovering workspaces"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "22.21.1"

    - name: Check package publishers
      shell: bash
      env:
        NPM_REGISTRY_URL: ${{ inputs.registry-url }}
        PACKAGE_FILES: ${{ inputs.package-files }}
        PACKAGE_ROOT: ${{ inputs.root }}
      run: |
        args=(--root "$PACKAGE_ROOT")
        if [[ -n "$PACKAGE_FILES" ]]; then
          args+=(--package-files "$PACKAGE_FILES")
        fi
        node "$GITHUB_ACTION_PATH/../../.github/tools/package-publisher-check.mjs" "${args[@]}"
