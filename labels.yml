# Org-wide standardized labels, applied by .github/workflows/label-sync.yml.
# Run it from the Actions tab; it defaults to plan mode and reports drift
# without writing. Priority and effort live in org issue fields, not here.

# Type
- name: "⚡ epic"
  color: "6B26A1"
  description: "epic, with subtasks"

- name: "🧹 refactor"
  color: "C0A97D"
  description: ""

- name: "🛠️  dev"
  color: "FBCA04"
  description: ""

- name: "🤖 AI"
  color: "5319E7"
  description: "All related work to AI usage"

- name: "🎨 ux"
  color: "dced23"
  description: "Change in graphics"

- name: "💭 triage"
  color: "EF4B67"
  description: "needs further confirmation if we want to implement"

- name: "🚧 blocked"
  color: "7C4504"
  description: "Waiting for another PR / BE / design"

- name: "📦 dependencies"
  color: "54c778"
  description: ""

- name: "🔌 external data"
  color: "19fd88"
  description: ""

- name: "📬 outlook plugin"
  color: "e87534"
  description: ""

- name: "🧮 table"
  color: "ca50b9"
  description: "Tabular review"

# Applied automatically by pr-lint from the conventional-commit type in the
# PR title (feat and refactor -> enhancement, fix -> bug). These exist so the
# labeller stops auto-creating them ad hoc with arbitrary colors.
- name: "enhancement"
  color: "0cd187"
  description: "New feature or improvement"

- name: "bug"
  color: "d73a4a"
  description: "Something is not working"

- name: "docs"
  color: "0075ca"
  description: "Documentation only"

- name: "chore"
  color: "5d0ca4"
  description: "Maintenance work with no user-facing change"

- name: "perf"
  color: "e97234"
  description: "Performance work"

# CI and governance
- name: "run-ci"
  color: "0E8A16"
  description: "Allow CI to run on an external contributor's PR"

- name: "needs approval"
  color: "FBCA04"
  description: "Feature request awaiting maintainer approval before work begins"

# Size (auto-applied by pr-lint)
- name: "size/XS"
  color: "009900"
  description: "Denotes a PR that changes 0-9 lines, ignoring generated files."

- name: "size/S"
  color: "77bb00"
  description: "Denotes a PR that changes 10-29 lines, ignoring generated files."

- name: "size/M"
  color: "eebb00"
  description: "Denotes a PR that changes 30-99 lines, ignoring generated files."

- name: "size/L"
  color: "ee9900"
  description: "Denotes a PR that changes 100-499 lines, ignoring generated files."

- name: "size/XL"
  color: "ee5500"
  description: "Denotes a PR that changes 500-999 lines, ignoring generated files."

- name: "size/XXL"
  color: "ee0000"
  description: "Denotes a PR that changes 1000+ lines, ignoring generated files."

# Standard GitHub labels
- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "question"
  color: "d876e3"
  description: "Further information is requested"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"
