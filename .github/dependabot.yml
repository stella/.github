version: 2

updates:
  - package-ecosystem: "github-actions"
    # Composite actions pin third-party actions too; "/" alone only covers
    # .github/workflows.
    directories:
      - "/"
      - "/actions/*"
      - "/.github/actions/*"
    schedule:
      interval: "cron"
      cronjob: "0 3 * * *"
      timezone: "Europe/Prague"
    cooldown:
      default-days: 5
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "📦 dependencies"
    commit-message:
      prefix: "chore"
    reviewers:
      - "jan-kubica"
      - "nnad3N"
