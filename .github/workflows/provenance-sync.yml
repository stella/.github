name: Provenance Sync

# Refreshes checked-in provenance artifacts on a same-repository pull request
# branch. Callers trigger it from `pull_request_target`, so Dependabot pull
# requests get the App credentials too. The pull request's code only runs in
# `generate`, which has a read-only token and no secrets; `commit` never
# executes pull request code and pushes the refresh as the GitHub App, so the
# new head gets a full set of checks.

on:
  workflow_call:
    inputs:
      root:
        description: "Repository root to scan"
        required: false
        type: string
        default: "."
      node-version:
        description: "Node.js version used to install cdxgen"
        required: false
        type: string
        default: "22"
      cdxgen-version:
        description: "Pinned @cyclonedx/cdxgen version"
        required: false
        type: string
        default: "12.1.5"
      provenance-version:
        description: "GitHub release tag in stella/provenance to install"
        required: false
        type: string
        default: "v0.1.3"
      provenance-repository:
        description: "Repository that hosts the provenance CLI"
        required: false
        type: string
        default: "stella/provenance"
      install-command:
        description: "Optional repository install command to run before provenance generate"
        required: false
        type: string
        default: "bun install --frozen-lockfile"
      commit-message:
        description: "Commit message for the refresh commit"
        required: false
        type: string
        default: "chore: refresh provenance artifacts"
    secrets:
      app_id:
        description: "GitHub App ID that owns the refresh commit"
        required: true
      app_private_key:
        description: "GitHub App private key that owns the refresh commit"
        required: true

permissions: {}

jobs:
  generate:
    name: Generate provenance
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.state == 'open'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      provenance-path: ${{ steps.diff.outputs.provenance-path }}
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # This job runs pull request code; it must not write the base
          # branch's cache.
          no-cache: true

      - name: Install cdxgen
        shell: bash
        env:
          CDXGEN_VERSION: ${{ inputs.cdxgen-version }}
        run: |
          case "$CDXGEN_VERSION" in
            ''|*[!A-Za-z0-9._-]*)
              echo "::error::Invalid cdxgen-version input: $CDXGEN_VERSION"
              exit 1
              ;;
          esac
          npm install --global "@cyclonedx/cdxgen@$CDXGEN_VERSION"

      - name: Install provenance
        shell: bash
        env:
          PROVENANCE_REPOSITORY: ${{ inputs.provenance-repository }}
          PROVENANCE_VERSION: ${{ inputs.provenance-version }}
        run: |
          set -euo pipefail

          case "$PROVENANCE_REPOSITORY" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "::error::Invalid provenance-repository input: $PROVENANCE_REPOSITORY"
              exit 1
              ;;
          esac
          case "$PROVENANCE_VERSION" in
            ''|*[!A-Za-z0-9._/-]*)
              echo "::error::Invalid provenance-version input: $PROVENANCE_VERSION"
              exit 1
              ;;
          esac

          asset_name="provenance-${PROVENANCE_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          checksums_name="provenance-${PROVENANCE_VERSION}-checksums.txt"
          release_base_url="https://github.com/${PROVENANCE_REPOSITORY}/releases/download/${PROVENANCE_VERSION}"
          asset_path="${RUNNER_TEMP}/${asset_name}"
          checksums_path="${RUNNER_TEMP}/${checksums_name}"
          install_root="${RUNNER_TEMP}/provenance-install"
          install_bin="${RUNNER_TEMP}/provenance-bin"

          curl --fail --silent --show-error --location \
            --output "$asset_path" \
            "${release_base_url}/${asset_name}"
          curl --fail --silent --show-error --location \
            --output "$checksums_path" \
            "${release_base_url}/${checksums_name}"

          expected_checksum="$(
            awk -v asset="$asset_name" '$2 == asset { print $1 }' "$checksums_path"
          )"
          if [ -z "$expected_checksum" ]; then
            echo "::error::Checksum for ${asset_name} not found in ${checksums_name}"
            exit 1
          fi

          actual_checksum="$(sha256sum "$asset_path" | awk '{ print $1 }')"
          if [ "$actual_checksum" != "$expected_checksum" ]; then
            echo "::error::Checksum mismatch for ${asset_name}"
            exit 1
          fi

          rm -rf "$install_root" "$install_bin"
          mkdir -p "$install_root" "$install_bin"
          tar -xzf "$asset_path" -C "$install_root"

          extracted_binary="$(find "$install_root" -type f -name provenance | head -n 1)"
          if [ -z "$extracted_binary" ]; then
            echo "::error::Failed to locate provenance in extracted release archive"
            exit 1
          fi

          cp "$extracted_binary" "$install_bin/provenance"
          chmod +x "$install_bin/provenance"
          echo "$install_bin" >> "$GITHUB_PATH"

      - name: Install repository dependencies
        if: inputs.install-command != ''
        shell: bash
        env:
          INSTALL_CMD: ${{ inputs.install-command }}
        working-directory: ${{ inputs.root }}
        run: $INSTALL_CMD

      - name: Generate provenance artifacts
        shell: bash
        env:
          PROVENANCE_ROOT: ${{ inputs.root }}
        run: |
          provenance_cdxgen="$(command -v cdxgen)"
          export PROVENANCE_CDXGEN="$provenance_cdxgen"
          provenance generate --root "$PROVENANCE_ROOT"

      - name: Detect provenance drift
        id: diff
        shell: bash
        env:
          PROVENANCE_ROOT: ${{ inputs.root }}
        run: |
          set -euo pipefail

          root="${PROVENANCE_ROOT%/}"
          if [ -z "$root" ] || [ "$root" = "." ]; then
            provenance_path="provenance"
          else
            provenance_path="$root/provenance"
          fi
          echo "provenance-path=$provenance_path" >> "$GITHUB_OUTPUT"

          if [ -z "$(git status --porcelain -- "$provenance_path")" ]; then
            echo "No provenance changes detected."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git status --short -- "$provenance_path"
          echo "changed=true" >> "$GITHUB_OUTPUT"

          # An archive also carries an empty tree, so deletions still commit.
          mkdir -p "$provenance_path"
          tar -cf "$RUNNER_TEMP/provenance.tar" -C "$provenance_path" .

      - name: Upload refreshed provenance
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance.tar
          if-no-files-found: error
          retention-days: 1

  commit:
    name: Commit provenance
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      # Checked out only as the commit base; nothing from it runs here.
      - name: Checkout pull request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Download refreshed provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance
          path: ${{ runner.temp }}/provenance-archive

      - name: Stage refreshed provenance
        shell: bash
        env:
          PROVENANCE_PATH: ${{ needs.generate.outputs.provenance-path }}
          ARCHIVE: ${{ runner.temp }}/provenance-archive/provenance.tar
          REFRESH_DIR: ${{ runner.temp }}/provenance-refresh
        run: |
          set -euo pipefail

          case "$PROVENANCE_PATH" in
            provenance | */provenance) ;;
            *)
              echo "::error::Unexpected provenance path: $PROVENANCE_PATH"
              exit 1
              ;;
          esac
          case "$PROVENANCE_PATH" in
            /* | *..*)
              echo "::error::Unexpected provenance path: $PROVENANCE_PATH"
              exit 1
              ;;
          esac
          # The archive comes from a job that ran pull request code: accept
          # only regular files and directories under relative, plain paths.
          if tar -tvf "$ARCHIVE" | grep -qv '^[-d]'; then
            echo "::error::The provenance archive may contain only regular files and directories."
            exit 1
          fi
          if tar -tf "$ARCHIVE" | grep -qE '(^/|(^|/)\.\.(/|$))'; then
            echo "::error::The provenance archive contains an unsafe path."
            exit 1
          fi
          mkdir -p "$REFRESH_DIR"
          tar -xf "$ARCHIVE" -C "$REFRESH_DIR" --no-same-owner --no-same-permissions

          rm -rf "$PROVENANCE_PATH"
          mkdir -p "$PROVENANCE_PATH"
          cp -R "$REFRESH_DIR"/. "$PROVENANCE_PATH"/
          git status --short -- "$PROVENANCE_PATH"

      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Checkout shared tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .signed-commit
          persist-credentials: false

      # A commit owned by the App (not GITHUB_TOKEN) triggers the pull
      # request's workflows for the new head.
      - name: Commit to the pull request branch
        uses: ./.signed-commit/.github/actions/signed-commit
        with:
          token: ${{ steps.app-token.outputs.token }}
          mode: append
          branch: ${{ github.event.pull_request.head.ref }}
          paths: ${{ needs.generate.outputs.provenance-path }}/**
          commit-message: ${{ inputs.commit-message }}
