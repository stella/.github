name: AI Shared Update

on:
  workflow_call:
    inputs:
      ref:
        description: "Branch or tag in stella/ai-shared to adopt"
        required: false
        type: string
        default: "main"
      base-branch:
        description: "Base branch for the generated pull request"
        required: false
        type: string
        default: ""
      branch:
        description: "Branch used for the generated pull request"
        required: false
        type: string
        default: "chore/update-ai-shared"
      commit-message:
        description: "Commit message for generated updates"
        required: false
        type: string
        default: "chore: update shared AI tooling"
      pr-title:
        description: "Pull request title"
        required: false
        type: string
        default: "chore: update shared AI tooling"
      pr-body:
        description: "Pull request body"
        required: false
        type: string
        default: "Automated update of the pinned stella/ai-shared revision and its generated repository files."
      validation-workflow:
        description: "Optional workflow file to dispatch when GITHUB_TOKEN creates the PR"
        required: false
        type: string
        default: ""
    secrets:
      auth_token:
        description: "Optional PAT or App token that can create PRs and trigger CI"
        required: false
      app_id:
        description: "Optional GitHub App ID used to mint a PR token"
        required: false
      app_private_key:
        description: "Optional GitHub App private key used to mint a PR token"
        required: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_AUTH_TOKEN: ${{ secrets.auth_token != '' }}
      HAS_APP_CREDENTIALS: >-
        ${{ secrets.app_id != ''
            && secrets.app_private_key != '' }}

    steps:
      - name: Validate inputs
        shell: bash
        env:
          AI_SHARED_REF: ${{ inputs.ref }}
          BASE_BRANCH: >-
            ${{ inputs.base-branch
                || github.event.repository.default_branch
                || 'main' }}
          UPDATE_BRANCH: ${{ inputs.branch }}
          VALIDATION_WORKFLOW: ${{ inputs.validation-workflow }}
        run: |
          for value_name in AI_SHARED_REF BASE_BRANCH UPDATE_BRANCH; do
            value="${!value_name}"
            case "$value" in
              ''|-*|*..*|/*|*' '*|*[!A-Za-z0-9._/-]*)
                echo "::error::Invalid ${value_name}: $value"
                exit 1
                ;;
            esac
          done

          if [ -n "$VALIDATION_WORKFLOW" ]; then
            case "$VALIDATION_WORKFLOW" in
              -*|*..*|/*|*' '*|*[!A-Za-z0-9._/-]*)
                echo "::error::Invalid validation-workflow: $VALIDATION_WORKFLOW"
                exit 1
                ;;
            esac
          fi

      - name: Checkout caller repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: >-
            ${{ inputs.base-branch
                || github.event.repository.default_branch
                || 'main' }}
          fetch-depth: 0
          persist-credentials: false
          submodules: true

      - name: Update pinned ai-shared revision
        id: shared
        shell: bash
        env:
          AI_SHARED_REF: ${{ inputs.ref }}
        run: |
          shared_path='.ai/shared'
          expected_url='https://github.com/stella/ai-shared.git'
          configured_path="$(
            git config -f .gitmodules --get 'submodule..ai/shared.path'
          )"
          configured_url="$(
            git config -f .gitmodules --get 'submodule..ai/shared.url'
          )"

          if [ "$configured_path" != "$shared_path" ]; then
            echo "::error::Expected the ai-shared submodule at $shared_path"
            exit 1
          fi
          if [ "$configured_url" != "$expected_url" ]; then
            echo "::error::Unexpected ai-shared submodule URL: $configured_url"
            exit 1
          fi
          if [ ! -x "$shared_path/scripts/sync-ai-skills.sh" ]; then
            echo "::error::Missing canonical ai-shared sync script"
            exit 1
          fi

          previous_revision="$(git -C "$shared_path" rev-parse HEAD)"
          if [ "$(git -C "$shared_path" rev-parse --is-shallow-repository)" = true ]; then
            git -C "$shared_path" fetch --unshallow origin "$AI_SHARED_REF"
          else
            git -C "$shared_path" fetch origin "$AI_SHARED_REF"
          fi
          next_revision="$(git -C "$shared_path" rev-parse FETCH_HEAD)"

          if ! git -C "$shared_path" merge-base --is-ancestor \
            "$previous_revision" "$next_revision"; then
            echo "::error::Refusing a non-fast-forward ai-shared update"
            exit 1
          fi

          git -C "$shared_path" checkout --detach "$next_revision"
          {
            echo "previous-revision=$previous_revision"
            echo "next-revision=$next_revision"
          } >> "$GITHUB_OUTPUT"

      - name: Regenerate AI instructions and skills
        shell: bash
        run: |
          bash .ai/shared/scripts/sync-ai-skills.sh .
          bash .ai/shared/scripts/sync-ai-skills.sh --check .

      # Mint write credentials only after the newly fetched script has finished.
      - name: Mint App token
        id: app-token
        if: >-
          env.HAS_AUTH_TOKEN != 'true'
          && env.HAS_APP_CREDENTIALS == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.app_id }}
          private-key: ${{ secrets.app_private_key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Open or update pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.auth_token || steps.app-token.outputs.token || github.token }}
          branch: ${{ inputs.branch }}
          base: >-
            ${{ inputs.base-branch
                || github.event.repository.default_branch
                || 'main' }}
          delete-branch: true
          commit-message: ${{ inputs.commit-message }}
          title: ${{ inputs.pr-title }}
          body: ${{ inputs.pr-body }}

      # GITHUB_TOKEN-authored PR workflows wait for manual approval. An explicit
      # workflow_dispatch is safe from recursive triggers and attaches CI to the
      # generated branch without exposing a long-lived token.
      - name: Dispatch validation workflow
        if: >-
          inputs.validation-workflow != ''
          && env.HAS_AUTH_TOKEN != 'true'
          && env.HAS_APP_CREDENTIALS != 'true'
          && (steps.cpr.outputs.pull-request-operation == 'created'
              || steps.cpr.outputs.pull-request-operation == 'updated')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          UPDATE_BRANCH: ${{ inputs.branch }}
          VALIDATION_WORKFLOW: ${{ inputs.validation-workflow }}
        run: >-
          gh workflow run "$VALIDATION_WORKFLOW"
          --repo "$GITHUB_REPOSITORY"
          --ref "$UPDATE_BRANCH"

      - name: Report updater result
        shell: bash
        env:
          NEXT_REVISION: ${{ steps.shared.outputs.next-revision }}
          OPERATION: ${{ steps.cpr.outputs.pull-request-operation }}
          PREVIOUS_REVISION: ${{ steps.shared.outputs.previous-revision }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "ai-shared: ${PREVIOUS_REVISION} -> ${NEXT_REVISION}"
          case "$OPERATION" in
            created|updated)
              echo "Opened or updated ai-shared PR: $PR_URL"
              ;;
            closed)
              echo "Closed stale ai-shared PR because no changes remain."
              ;;
            *)
              echo "No ai-shared changes detected."
              ;;
          esac
