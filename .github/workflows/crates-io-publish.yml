name: crates.io publish

on:
  workflow_call:
    inputs:
      crate-name:
        description: Exact crates.io package name.
        required: true
        type: string
      manifest-path:
        description: Repo-relative Cargo.toml for the published crate.
        required: true
        type: string
      version-file:
        description: Repo-relative release version file.
        required: false
        type: string
        default: VERSION
      rust-toolchain:
        description: Rust toolchain used to package the crate.
        required: false
        type: string
        default: 1.99.0
      environment:
        description: GitHub environment registered with crates.io.
        required: false
        type: string
        default: crates-io
    outputs:
      crate-sha256:
        description: SHA-256 of the crate archive crates.io serves for this version.
        value: ${{ jobs.publish.outputs.published-sha256 }}

permissions: {}

jobs:
  package:
    name: Package crate without OIDC
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      crate-sha256: ${{ steps.metadata.outputs.crate-sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Rust toolchain
        env:
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
        run: |
          if [ "$RUST_TOOLCHAIN" != "1.99.0" ]; then
            echo "::error::rust-toolchain must be 1.99.0"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
      - name: Checkout immutable publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Package crate
        env:
          MANIFEST_PATH: ${{ inputs.manifest-path }}
        run: cargo package --locked --manifest-path "${MANIFEST_PATH}"
      - name: Build exact crates.io upload artifact
        id: metadata
        shell: bash
        env:
          CRATE_NAME: ${{ inputs.crate-name }}
          MANIFEST_PATH: ${{ inputs.manifest-path }}
          VERSION_FILE: ${{ inputs.version-file }}
        run: |
          set -euo pipefail
          mkdir core-crate
          node .release-tooling/.github/tools/create-crate-upload.mjs \
            "${CRATE_NAME}" \
            "${MANIFEST_PATH}" \
            "${VERSION_FILE}" \
            core-crate
          echo "crate-sha256=$(jq -er '.crateSha256' core-crate/release.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates-io-${{ inputs.crate-name }}
          path: core-crate
          if-no-files-found: error
      - name: Upload public crate release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crate-release-${{ inputs.crate-name }}
          path: core-crate/*.crate
          if-no-files-found: error

  attest:
    name: Attest prepared crate
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write # Record the prepared crate attestation.
      id-token: write # Sign the prepared crate attestation.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates-io-${{ inputs.crate-name }}
          path: core-crate
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: core-crate/*.crate

  publish:
    name: Publish prepared crate
    needs: [package, attest]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write # Exchange a short-lived crates.io publishing token.
    outputs:
      published-sha256: ${{ steps.publish.outputs.published-sha256 }}
      reused-archive: ${{ steps.publish.outputs.reused-archive }}
    steps:
      - name: Checkout immutable publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates-io-${{ inputs.crate-name }}
          path: core-crate
      - name: Authenticate to crates.io
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish exact crate bytes
        id: publish
        shell: bash
        env:
          CRATE_DIRECTORY: core-crate
          CRATES_IO_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
          EXPECTED_CRATE_NAME: ${{ inputs.crate-name }}
          PUBLISHED_ARCHIVE_DIRECTORY: published-crate
        run: bash -eo pipefail .release-tooling/.github/tools/publish-crate.sh
      - name: Keep the reused registry archive
        if: steps.publish.outputs.reused-archive != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crates-io-published-${{ inputs.crate-name }}
          path: published-crate/*.crate
          if-no-files-found: error

  attest-published:
    name: Attest reused registry archive
    needs: publish
    if: needs.publish.outputs.reused-archive != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write # Record the registry archive attestation.
      id-token: write # Sign the registry archive attestation.
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: crates-io-published-${{ inputs.crate-name }}
          path: published-crate
      - name: Check the reported digest
        shell: bash
        env:
          PUBLISHED_SHA256: ${{ needs.publish.outputs.published-sha256 }}
        run: |
          set -euo pipefail
          files=(published-crate/*.crate)
          [[ "${#files[@]}" == 1 ]]
          echo "${PUBLISHED_SHA256}  ${files[0]}" | sha256sum --check --strict
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: published-crate/*.crate
