name: PyPI publish

on:
  workflow_call:
    inputs:
      artifact-pattern:
        description: Artifact pattern containing one wheel per artifact directory.
        required: false
        type: string
        default: python-wheel-*
      expected-version:
        description: Exact version expected in every wheel.
        required: true
        type: string
      project-name:
        description: Exact Python project name from wheel METADATA.
        required: true
        type: string
      distribution-name:
        description: Exact underscore-normalized wheel filename prefix.
        required: true
        type: string
      wheel-contract:
        description: JSON object mapping artifact names to exact platform tag arrays.
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Validate and publish Python wheels
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Exchange a short-lived PyPI publishing credential.
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.artifact-pattern }}
          path: wheel-artifacts
      - name: Checkout immutable publisher tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .release-tooling
          persist-credentials: false
      - name: Validate exact wheel set
        shell: bash
        env:
          DISTRIBUTION_NAME: ${{ inputs.distribution-name }}
          EXPECTED_VERSION: ${{ inputs.expected-version }}
          PROJECT_NAME: ${{ inputs.project-name }}
          VALIDATOR_PATH: .release-tooling/.github/actions/pypi-publish-hardened/validate_wheels.py
          WHEEL_CONTRACT: ${{ inputs.wheel-contract }}
        run: python3 "${VALIDATOR_PATH}" wheel-artifacts dist
      - name: Verify any existing PyPI files match exact bytes
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          PYPI_VERSION: ${{ inputs.expected-version }}
          VERIFIER_PATH: .release-tooling/.github/actions/pypi-publish-hardened/verify_registry.py
        run: python3 "${VERIFIER_PATH}" --allow-missing
      - name: Publish wheels to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
          skip-existing: true
      - name: Verify published PyPI files match exact bytes
        shell: bash
        env:
          PROJECT_NAME: ${{ inputs.project-name }}
          PYPI_VERSION: ${{ inputs.expected-version }}
          VERIFIER_PATH: .release-tooling/.github/actions/pypi-publish-hardened/verify_registry.py
        run: python3 "${VERIFIER_PATH}"
