name: CLA Assistant

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, closed]

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request_target') && format('pr-{0}', github.event.pull_request.number || github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request_target' }}

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    # The main ruleset requires the `cla / cla` context on every pull request.
    # A skipped caller job never reports it, so bot pull requests run the
    # reusable workflow too; its allowlist waives the signature for them.
    if: |
      github.event_name == 'pull_request_target' || (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == 'recheck' ||
          github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        )
      )
    uses: ./.github/workflows/cla.yml
    with:
      allowlist: dependabot[bot],renovate[bot],github-actions[bot],stella-provenance-updater[bot]
    secrets:
      CLA_APP_PRIVATE_KEY: ${{ secrets.CLA_APP_PRIVATE_KEY }}
