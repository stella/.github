name: Package quarantine policy

on:
  pull_request:
  merge_group:
  workflow_call:

permissions: {}

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository != 'stella/.github' || github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Checkout immutable policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quarantine-policy
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Enforce package quarantine
        run: >-
          bun .quarantine-policy/.github/actions/quarantine-policy/check.ts
          "${{ job.workflow_sha }}"
          "${{ github.repository }}"
      - name: Enforce newly locked package ages
        run: |
          set -euo pipefail
          git show HEAD^1:bun.lock > "$RUNNER_TEMP/base-bun.lock"
          bun .quarantine-policy/.github/actions/quarantine-policy/check-lock-age.ts \
            "$RUNNER_TEMP/base-bun.lock"
