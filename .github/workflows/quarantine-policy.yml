name: Package quarantine policy

on:
  pull_request:
  merge_group:
  workflow_call:

permissions: {}

jobs:
  enforce:
    name: Enforce package quarantine
    if: github.repository != 'stella/.github' || github.event_name == 'workflow_call'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkout trusted target base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: .quarantine-base
          sparse-checkout: |
            bun.lock
            bunfig.toml
            .npmrc
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Checkout immutable policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .quarantine-policy
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - name: Enforce package quarantine
        run: >-
          bun .quarantine-policy/.github/actions/quarantine-policy/check.ts
          "${{ job.workflow_sha }}"
          "${{ github.repository }}"
      - name: Enforce newly locked package ages
        run: >-
          bun .quarantine-policy/.github/actions/quarantine-policy/check-lock-age.ts
          .quarantine-base/bun.lock
          .quarantine-base/bunfig.toml
          .quarantine-base/.npmrc
