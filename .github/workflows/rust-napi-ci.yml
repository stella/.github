name: Rust NAPI CI

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      trusted:
        description: "Whether the caller has deemed this run trusted"
        required: false
        type: string
        default: "false"
      rust-changed:
        description: "Whether the caller requests Rust checks in addition to the workflow’s manifest, lockfile, toolchain, crate, and Rust source detection."
        required: false
        type: string
        default: "true"
      build-changed:
        description: "Whether build-related inputs changed"
        required: false
        type: string
        default: "true"
      provenance-changed:
        description: "Whether provenance-affecting inputs changed"
        required: false
        type: string
        default: "true"
      provenance-version:
        description: "Pinned stella/provenance release tag"
        required: false
        type: string
        default: "v0.1.2"
      property-test-command:
        description: "Optional extra test command to run on ubuntu-latest"
        required: false
        type: string
        default: ""
      rust-format-command:
        description: "Cargo fmt command"
        required: false
        type: string
        default: "cargo fmt --all -- --check"
      install-ignore-scripts:
        description: "Install dependencies without running package lifecycle scripts; the frozen lockfile install itself is fixed."
        required: false
        type: boolean
        default: false
      typecheck:
        description: "Run typecheck and a seeded-error rejection probe"
        required: false
        type: boolean
        default: false

env:
  CARGO_INCREMENTAL: 0

jobs:
  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  version-check:
    name: Version sync
    if: inputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - run: node scripts/version-sync.mjs check

  lint:
    name: Lint
    if: inputs.trusted == 'true'
    needs: [workflow-lint, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: stella/.github/actions/package-publisher-check@main
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        env:
          INSTALL_IGNORE_SCRIPTS: ${{ inputs.install-ignore-scripts }}
        shell: bash
        run: |
          if [[ "$INSTALL_IGNORE_SCRIPTS" == 'true' ]]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi
      - run: bun run lint

  typecheck:
    name: Typecheck
    if: inputs.trusted == 'true' && inputs.typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - name: Install dependencies
        env:
          INSTALL_IGNORE_SCRIPTS: ${{ inputs.install-ignore-scripts }}
        shell: bash
        run: |
          if [[ "$INSTALL_IGNORE_SCRIPTS" == 'true' ]]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi
      - run: bun run check:toolchain
      - run: bun run typecheck
      - name: Reject a seeded type error
        shell: bash
        run: |
          probe=$(mktemp src/typecheck-rejection-XXXXXX.ts)
          trap 'rm -f "$probe"' EXIT
          printf 'export const typecheckRejectionProbe: string = 123;\n' > "$probe"
          log="$RUNNER_TEMP/typecheck-rejection.log"
          if bun run typecheck > "$log" 2>&1; then
            cat "$log"
            echo "::error::Typecheck accepted a seeded type error."
            exit 1
          fi
          cat "$log"
          grep -F "$(basename "$probe")" "$log" | grep -E 'TS2322([^0-9]|$)'

  runtime-compat:
    name: Runtime - ${{ matrix.runtime }} / ${{ matrix.os }}
    if: inputs.trusted == 'true'
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: bun
          - os: ubuntu-latest
            runtime: node
          - os: macos-15
            runtime: bun
          - os: macos-15
            runtime: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          targets: wasm32-wasip1-threads
      - name: Ensure cargo on PATH
        # dtolnay/rust-toolchain only prepends $CARGO_HOME/bin to PATH when it
        # installs rustup itself. On runners with pre-installed rustup but no
        # active toolchain, `cargo` resolves to a `rustup-init` symlink and
        # fails with `unexpected argument 'metadata'`.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        env:
          INSTALL_IGNORE_SCRIPTS: ${{ inputs.install-ignore-scripts }}
        shell: bash
        run: |
          if [[ "$INSTALL_IGNORE_SCRIPTS" == 'true' ]]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi
      - run: bun run build
      - run: bun run build:js
      - name: Bun runtime smoke
        if: matrix.runtime == 'bun'
        run: bun run test:runtime:bun
      - name: Node runtime smoke
        if: matrix.runtime == 'node'
        run: node scripts/runtime-smoke.mjs

  detect-rust:
    name: Detect Rust inputs
    if: inputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rust-changed: ${{ steps.select.outputs.rust-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select Rust checks
        id: select
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        shell: bash
        run: |
          rust_changed=true
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && ! "$BASE_SHA" =~ ^0+$ ]] && merge_base=$(git merge-base HEAD "$BASE_SHA"); then
            if ! git diff --quiet "$merge_base" HEAD -- 'Cargo.toml' 'Cargo.lock' '**/Cargo.toml' '**/Cargo.lock' 'rust-toolchain' 'rust-toolchain.toml' 'crates/**' 'src/**/*.rs'; then
              rust_changed=true
            else
              rust_changed=false
            fi
          else
            echo '::notice::Merge base unavailable; running Rust checks.'
          fi
          echo "rust-changed=$rust_changed" >> "$GITHUB_OUTPUT"

  rust-checks:
    name: Rust checks
    if: inputs.trusted == 'true' && (inputs.rust-changed == 'true' || needs.detect-rust.outputs.rust-changed == 'true')
    needs: [detect-rust]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      STELLA_SOURCE_LINT_REV: a1bd81740ecb4b66999f56d1716e1190c4e7272f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - name: Ensure cargo on PATH
        # See note in `runtime-compat`: workaround for dtolnay/rust-toolchain
        # not adding $CARGO_HOME/bin to PATH when rustup is pre-installed.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust-checks
      - name: Cache stable source checker
        id: source-lint-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/stella-source-lint/bin
          key: stella-source-lint-${{ runner.os }}-${{ runner.arch }}-${{ env.STELLA_SOURCE_LINT_REV }}
      - name: Install stable source checker
        if: steps.source-lint-cache.outputs.cache-hit != 'true'
        run: >-
          cargo install --git https://github.com/stella/tooling
          --rev "$STELLA_SOURCE_LINT_REV" --locked
          --root "$RUNNER_TEMP/stella-source-lint" stella_source_lint
      - name: Add stable source checker to PATH
        run: echo "$RUNNER_TEMP/stella-source-lint/bin" >> "$GITHUB_PATH"
      - name: Stable source lint
        run: cargo stella-lint .
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -Dwarnings
      - name: Format
        run: $RUST_FORMAT_CMD
        env:
          RUST_FORMAT_CMD: ${{ inputs.rust-format-command }}
      - name: Tests
        run: cargo test --locked --workspace --all-targets --all-features
      - name: License audit
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: Docs
        run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  provenance:
    name: Provenance
    if: inputs.trusted == 'true' && inputs.provenance-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        env:
          INSTALL_IGNORE_SCRIPTS: ${{ inputs.install-ignore-scripts }}
        shell: bash
        run: |
          if [[ "$INSTALL_IGNORE_SCRIPTS" == 'true' ]]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi
      - uses: stella/.github/actions/provenance-check@636b7841096c8f0cc5a1572077b78768ef8fea42
        with:
          provenance-version: ${{ inputs.provenance-version }}

  detect:
    name: Detect build inputs
    if: inputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      build-changed: ${{ steps.select.outputs.build-changed }}
    steps:
      - name: Select build and artifact tests
        id: select
        env:
          BUILD_CHANGED: ${{ inputs.build-changed }}
        shell: bash
        run: |
          if [[ "$BUILD_CHANGED" == 'true' ]]; then
            echo 'build-changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build-changed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Build inputs unchanged; skipping matrix builds and artifact-based tests.'
          fi

  # Static names keep required checks present even when jobs are skipped.
  # A job-level matrix condition would skip expansion and omit those names.

  build:
    name: Build - x86_64-apple-darwin
    if: inputs.trusted == 'true' && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: x86_64-apple-darwin
      BUILD_KIND: native
    permissions:
      contents: read
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          targets: ${{ env.BUILD_TARGET }}
      - name: Ensure cargo on PATH
        # See note in `runtime-compat`: workaround for dtolnay/rust-toolchain
        # not adding $CARGO_HOME/bin to PATH when rustup is pre-installed.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: build-${{ env.BUILD_TARGET }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        env:
          INSTALL_IGNORE_SCRIPTS: ${{ inputs.install-ignore-scripts }}
        shell: bash
        run: |
          if [[ "$INSTALL_IGNORE_SCRIPTS" == 'true' ]]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi
      - name: Build (native)
        if: >-
          env.BUILD_KIND == 'native'
        run: >
          bun run build
          --target ${{ env.BUILD_TARGET }}
      - name: Build (cross-compile)
        if: env.BUILD_KIND == 'cross'
        run: >
          bun run build
          --target ${{ env.BUILD_TARGET }}
          --use-napi-cross
      - name: Build (WASM)
        if: env.BUILD_KIND == 'wasm'
        run: bun run build:wasm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-${{ env.BUILD_TARGET }}
          path: |
            *.node
            *.wasm
            !*.debug.wasm
            *.cjs
            *.wasi-browser.js
            wasi-worker*.mjs
          if-no-files-found: error

  build-macos-arm64:
    name: Build - aarch64-apple-darwin
    if: inputs.trusted == 'true' && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: aarch64-apple-darwin
      BUILD_KIND: native
    permissions:
      contents: read
    steps: *build-steps

  build-linux:
    name: Build - x86_64-unknown-linux-gnu
    if: inputs.trusted == 'true' && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: x86_64-unknown-linux-gnu
      BUILD_KIND: native
    permissions:
      contents: read
    steps: *build-steps

  build-linux-arm64:
    name: Build - aarch64-unknown-linux-gnu
    if: inputs.trusted == 'true' && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: aarch64-unknown-linux-gnu
      BUILD_KIND: cross
    permissions:
      contents: read
    steps: *build-steps

  build-wasm:
    name: Build - wasm32-wasip1-threads
    if: inputs.trusted == 'true' && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: wasm32-wasip1-threads
      BUILD_KIND: wasm
    permissions:
      contents: read
    steps: *build-steps

  test:
    name: Test (ubuntu-latest)
    if: inputs.trusted == 'true' && needs.detect.outputs.build-changed == 'true'
    needs: [detect, build, build-macos-arm64, build-linux, build-linux-arm64, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install dependencies
        env:
          INSTALL_IGNORE_SCRIPTS: ${{ inputs.install-ignore-scripts }}
        shell: bash
        run: |
          if [[ "$INSTALL_IGNORE_SCRIPTS" == 'true' ]]; then
            bun install --frozen-lockfile --ignore-scripts
          else
            bun install --frozen-lockfile
          fi
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
      - name: Move artifacts
        shell: bash
        run: |
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/*.node . 2>/dev/null || true
            cp -- "$dir"/*.wasm . 2>/dev/null || true
            cp -- "$dir"/*.cjs . 2>/dev/null || true
            cp -- "$dir"/*.wasi-browser.js . 2>/dev/null || true
            cp -- "$dir"/wasi-worker*.mjs . 2>/dev/null || true
          done
          ls -la -- *.node 2>/dev/null || echo "No .node files"
          ls -la -- *.wasm 2>/dev/null || echo "No .wasm files"
      - run: bun test
      - name: Property tests
        if: >-
          runner.os == 'Linux'
          && inputs.property-test-command != ''
        run: $PROPERTY_TEST_CMD
        env:
          PROPERTY_TEST_CMD: ${{ inputs.property-test-command }}

  test-macos:
    name: Test (macos-15)
    if: inputs.trusted == 'true' && needs.detect.outputs.build-changed == 'true'
    needs: [detect, build, build-macos-arm64, build-linux, build-linux-arm64, build-wasm]
    runs-on: macos-15
    permissions:
      contents: read
    steps: *test-steps
