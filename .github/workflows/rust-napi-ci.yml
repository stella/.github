name: Rust NAPI CI

on:
  workflow_call:
    inputs:
      scope:
        description: "Run the full matrix or the single-runner pull-request suite"
        required: false
        type: string
        default: "full"
      node-version:
        description: "Node.js version"
        required: false
        type: string
        default: "22"
      trusted:
        description: "Whether the caller has deemed this run trusted"
        required: false
        type: string
        default: "false"
      rust-changed:
        description: "Whether Rust-related inputs changed"
        required: false
        type: string
        default: "true"
      build-changed:
        description: "Whether build-related inputs changed"
        required: false
        type: string
        default: "true"
      provenance-changed:
        description: "Whether provenance-affecting inputs changed"
        required: false
        type: string
        default: "true"
      provenance-version:
        description: "Pinned stella/provenance release tag"
        required: false
        type: string
        default: "v0.1.2"
      property-test-command:
        description: "Optional extra test command to run on ubuntu-latest"
        required: false
        type: string
        default: ""
      rust-format-command:
        description: "Cargo fmt command"
        required: false
        type: string
        default: "cargo fmt --all -- --check"
      install-command:
        description: "Command used to install dependencies. `--no-verify` works around bun's integrity check on napi-rs platform sub-packages."
        required: false
        type: string
        default: "bun install --frozen-lockfile --no-verify"
      typecheck:
        description: "Run typecheck and a seeded-error rejection probe"
        required: false
        type: boolean
        default: false
      typecheck-only:
        description: "Run only workflow lint and the typecheck job (for nightly parity callers)"
        required: false
        type: boolean
        default: false
      parity:
        description: "Compiler parity mode: changed (Bun/TypeScript versions) or always (nightly)"
        required: false
        type: string
        default: "changed"

env:
  CARGO_INCREMENTAL: 0

jobs:
  pr:
    name: PR checks (ubuntu-latest)
    if: inputs.scope == 'pr' && inputs.trusted == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate scope
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "$SCOPE" != 'pr' ]]; then
            echo "::error::Invalid scope '$SCOPE'; expected 'full' or 'pr'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: ${{ inputs.typecheck && 0 || 1 }}
          persist-credentials: false
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ inputs.node-version }}
      - run: node scripts/version-sync.mjs check
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: ${{ inputs.install-command }}
      - run: bun run lint
      - if: inputs.typecheck
        uses: ./.github/actions/napi-typecheck
        with:
          parity: ${{ inputs.parity }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      - name: Cache Rust build outputs
        if: inputs.rust-changed == 'true' || inputs.build-changed == 'true'
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          shared-key: pr-1.99.0-${{ hashFiles('Cargo.lock') }}
      - if: inputs.rust-changed == 'true'
        uses: ./.github/actions/napi-rust-checks
        with:
          rust-format-command: ${{ inputs.rust-format-command }}
          cache: "false"
      - if: inputs.provenance-changed == 'true'
        uses: stella/.github/actions/provenance-check@636b7841096c8f0cc5a1572077b78768ef8fea42
        with:
          provenance-version: ${{ inputs.provenance-version }}
      - if: inputs.build-changed == 'true'
        uses: ./.github/actions/napi-build
        with:
          target: x86_64-unknown-linux-gnu
          kind: native
          node-version: ${{ inputs.node-version }}
          install-command: ${{ inputs.install-command }}
          cache: "false"
      - if: inputs.build-changed == 'true'
        run: bun run build:js
      - if: inputs.build-changed == 'true'
        run: bun test
      - name: Property tests
        if: inputs.build-changed == 'true' && inputs.property-test-command != ''
        run: $PROPERTY_TEST_CMD
        env:
          PROPERTY_TEST_CMD: ${{ inputs.property-test-command }}
      - if: inputs.build-changed == 'true'
        run: bun run test:runtime:bun
      - if: inputs.build-changed == 'true'
        run: node scripts/runtime-smoke.mjs

  workflow-lint:
    name: Workflow lint
    if: inputs.scope == 'full' || (inputs.scope != 'full' && inputs.scope != 'pr')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate scope
        env:
          SCOPE: ${{ inputs.scope }}
        run: |
          if [[ "$SCOPE" != 'full' ]]; then
            echo "::error::Invalid scope '$SCOPE'; expected 'full' or 'pr'."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  version-check:
    name: Version sync
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ inputs.node-version }}
      - run: node scripts/version-sync.mjs check

  lint:
    name: Lint
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only
    needs: [workflow-lint, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: ${{ inputs.install-command }}
      - run: bun run lint

  typecheck:
    name: Typecheck and parity
    if: inputs.scope == 'full' && inputs.trusted == 'true' && inputs.typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: ${{ inputs.install-command }}
      - uses: ./.github/actions/napi-typecheck
        with:
          parity: ${{ inputs.parity }}
          base-sha: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}

  runtime-compat:
    name: Runtime - ${{ matrix.runtime }} / ${{ matrix.os }}
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            runtime: bun
          - os: ubuntu-latest
            runtime: node
          - os: macos-15
            runtime: bun
          - os: macos-15
            runtime: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ inputs.node-version }}
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.99.0
          targets: wasm32-wasip1-threads
      - name: Ensure cargo on PATH
        # dtolnay/rust-toolchain only prepends $CARGO_HOME/bin to PATH when it
        # installs rustup itself. On runners with pre-installed rustup but no
        # active toolchain, `cargo` resolves to a `rustup-init` symlink and
        # fails with `unexpected argument 'metadata'`.
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: ${{ inputs.install-command }}
      - run: bun run build
      - run: bun run build:js
      - name: Bun runtime smoke
        if: matrix.runtime == 'bun'
        run: bun run test:runtime:bun
      - name: Node runtime smoke
        if: matrix.runtime == 'node'
        run: node scripts/runtime-smoke.mjs

  rust-checks:
    name: Rust checks
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && inputs.rust-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/napi-rust-checks
        with:
          rust-format-command: ${{ inputs.rust-format-command }}

  provenance:
    name: Provenance
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && inputs.provenance-changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: ${{ inputs.install-command }}
      - uses: stella/.github/actions/provenance-check@636b7841096c8f0cc5a1572077b78768ef8fea42
        with:
          provenance-version: ${{ inputs.provenance-version }}

  detect:
    name: Detect build inputs
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      build-changed: ${{ steps.select.outputs.build-changed }}
    steps:
      - name: Select build and artifact tests
        id: select
        env:
          BUILD_CHANGED: ${{ inputs.build-changed }}
        shell: bash
        run: |
          if [[ "$BUILD_CHANGED" == 'true' ]]; then
            echo 'build-changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'build-changed=false' >> "$GITHUB_OUTPUT"
            echo '::notice::Build inputs unchanged; skipping matrix builds and artifact-based tests.'
          fi

  # Static names keep required checks present even when jobs are skipped.
  # A job-level matrix condition would skip expansion and omit those names.

  build:
    name: Build - x86_64-apple-darwin
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: x86_64-apple-darwin
      BUILD_KIND: native
    permissions:
      contents: read
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: ./.github/actions/napi-build
        with:
          target: ${{ env.BUILD_TARGET }}
          kind: ${{ env.BUILD_KIND }}
          node-version: ${{ inputs.node-version }}
          install-command: ${{ inputs.install-command }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bindings-${{ env.BUILD_TARGET }}
          path: |
            *.node
            *.wasm
            !*.debug.wasm
            *.cjs
            *.wasi-browser.js
            wasi-worker*.mjs
          if-no-files-found: error

  build-macos-arm64:
    name: Build - aarch64-apple-darwin
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: macos-15
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: aarch64-apple-darwin
      BUILD_KIND: native
    permissions:
      contents: read
    steps: *build-steps

  build-linux:
    name: Build - x86_64-unknown-linux-gnu
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: x86_64-unknown-linux-gnu
      BUILD_KIND: native
    permissions:
      contents: read
    steps: *build-steps

  build-linux-arm64:
    name: Build - aarch64-unknown-linux-gnu
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: aarch64-unknown-linux-gnu
      BUILD_KIND: cross
    permissions:
      contents: read
    steps: *build-steps

  build-wasm:
    name: Build - wasm32-wasip1-threads
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && needs.detect.outputs.build-changed == 'true'
    needs: [detect]
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      BUILD_TARGET: wasm32-wasip1-threads
      BUILD_KIND: wasm
    permissions:
      contents: read
    steps: *build-steps

  test:
    name: Test (ubuntu-latest)
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && needs.detect.outputs.build-changed == 'true'
    needs: [detect, build, build-macos-arm64, build-linux, build-linux-arm64, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps: &test-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - run: ${{ inputs.install-command }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
      - name: Move artifacts
        shell: bash
        run: |
          ls -R artifacts/
          for dir in artifacts/bindings-*; do
            cp -- "$dir"/*.node . 2>/dev/null || true
            cp -- "$dir"/*.wasm . 2>/dev/null || true
            cp -- "$dir"/*.cjs . 2>/dev/null || true
            cp -- "$dir"/*.wasi-browser.js . 2>/dev/null || true
            cp -- "$dir"/wasi-worker*.mjs . 2>/dev/null || true
          done
          ls -la -- *.node 2>/dev/null || echo "No .node files"
          ls -la -- *.wasm 2>/dev/null || echo "No .wasm files"
      - run: bun test
      - name: Property tests
        if: >-
          runner.os == 'Linux'
          && inputs.property-test-command != ''
        run: $PROPERTY_TEST_CMD
        env:
          PROPERTY_TEST_CMD: ${{ inputs.property-test-command }}

  test-macos:
    name: Test (macos-15)
    if: inputs.scope == 'full' && inputs.trusted == 'true' && !inputs.typecheck-only && needs.detect.outputs.build-changed == 'true'
    needs: [detect, build, build-macos-arm64, build-linux, build-linux-arm64, build-wasm]
    runs-on: macos-15
    permissions:
      contents: read
    steps: *test-steps
