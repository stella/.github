name: Changeset release PR

on:
  workflow_call:
    inputs:
      bun-version-file:
        description: package.json containing the Bun version used by the repository.
        required: false
        type: string
        default: package.json
      title:
        description: Version PR title.
        required: false
        type: string
        default: "chore: version packages"
      commit:
        description: Version PR commit message.
        required: false
        type: string
        default: "chore: version packages"
    secrets:
      CHANGELOG_APP_ID:
        description: GitHub App ID used to maintain the version PR.
        required: true
      CHANGELOG_APP_PRIVATE_KEY:
        description: GitHub App private key used to maintain the version PR.
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Maintain version packages PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ inputs.bun-version-file }}

      - run: bun install --frozen-lockfile

      # Install hooks run before a write-capable credential exists in the job.
      - name: Mint version PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update version packages PR
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run changeset:version
          title: ${{ inputs.title }}
          commit: ${{ inputs.commit }}
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
