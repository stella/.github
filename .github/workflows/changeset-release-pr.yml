name: Changeset release PR

on:
  workflow_call:
    inputs:
      runs-on:
        description: "Runner labels as a JSON array"
        required: false
        type: string
        default: '["ubuntu-latest"]'
      bun-version-file:
        description: package.json containing the Bun version used by the repository.
        required: false
        type: string
        default: package.json
      title:
        description: Version PR title.
        required: false
        type: string
        default: "chore: version packages"
      commit:
        description: Version PR commit message.
        required: false
        type: string
        default: "chore: version packages"
      sync-cargo-inherited-lock:
        description: >-
          Validate and synchronize Cargo.lock entries for workspace packages
          that inherit workspace.package.version.
        required: false
        type: boolean
        default: false
      cargo-manifest:
        description: Repo-relative root Cargo workspace manifest.
        required: false
        type: string
        default: Cargo.toml
      cargo-lockfile:
        description: Repo-relative Cargo lockfile.
        required: false
        type: string
        default: Cargo.lock
      prepare-rust-wasm:
        description: >-
          Install the wasm32-unknown-unknown target and the wasm-bindgen CLI
          version resolved by the locked Cargo workspace before versioning.
        required: false
        type: boolean
        default: false
    secrets:
      CHANGELOG_APP_ID:
        description: GitHub App ID used to maintain the version PR.
        required: true
      CHANGELOG_APP_PRIVATE_KEY:
        description: GitHub App private key used to maintain the version PR.
        required: true

permissions:
  contents: read

jobs:
  version:
    name: Maintain version packages PR
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    timeout-minutes: 15
    concurrency:
      group: changeset-release-pr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: ${{ inputs.bun-version-file }}

      - run: bun install --frozen-lockfile

      - if: inputs.sync-cargo-inherited-lock || inputs.prepare-rust-wasm
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      # rust-toolchain only prepends the toolchain when it installs one. Keep
      # Cargo available when the runner already has the requested toolchain.
      - if: inputs.sync-cargo-inherited-lock || inputs.prepare-rust-wasm
        name: Add Cargo to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - if: inputs.prepare-rust-wasm
        name: Prepare locked Rust Wasm toolchain
        shell: bash
        env:
          CARGO_MANIFEST_PATH: ${{ inputs.cargo-manifest }}
        run: |
          set -euo pipefail
          rustup target add wasm32-unknown-unknown

          mapfile -t versions < <(
            cargo metadata \
              --locked \
              --manifest-path "$CARGO_MANIFEST_PATH" \
              --format-version 1 \
              --all-features \
              | jq -r '[.packages[] | select(.name == "wasm-bindgen") | .version] | unique | .[]'
          )
          if [[ "${#versions[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one locked wasm-bindgen version; found: ${versions[*]:-none}"
            exit 1
          fi
          cargo install wasm-bindgen-cli --version "${versions[0]}" --locked

      - if: inputs.sync-cargo-inherited-lock
        name: Validate inherited Cargo lock versions
        id: cargo-sync
        uses: stella/.github/.github/actions/sync-cargo-workspace-lock@1ce0079bbdbf93a4c1917d2857496b89aedcec14
        with:
          mode: check
          manifest: ${{ inputs.cargo-manifest }}
          lockfile: ${{ inputs.cargo-lockfile }}

      - name: Prepare version command
        id: version-command
        shell: bash
        run: |
          set -euo pipefail
          version_command="$RUNNER_TEMP/stella-changeset-version.sh"
          cat > "$version_command" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          bun run changeset:version
          if [[ "$SYNC_CARGO_INHERITED_LOCK" == "true" ]]; then
            if [[ -z "$CARGO_SYNC_SCRIPT" ]]; then
              echo "::error::Cargo synchronizer path is unavailable"
              exit 1
            fi
            node "$CARGO_SYNC_SCRIPT" \
              --mode write \
              --manifest "$CARGO_MANIFEST_PATH" \
              --lockfile "$CARGO_LOCKFILE_PATH"
          fi
          EOF
          chmod 0700 "$version_command"
          printf 'path=%s\n' "$version_command" >> "$GITHUB_OUTPUT"

      - name: Check release source is current
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" \
              --jq '.object.sha'
          )"
          if [[ "$current_sha" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "current=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping version PR update because $GITHUB_SHA is no longer the head of $GITHUB_REF_NAME."

      # Install hooks run before a write-capable credential exists in the job.
      - if: steps.source.outputs.current == 'true'
        name: Mint version PR token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CHANGELOG_APP_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - if: steps.source.outputs.current == 'true'
        name: Create or update version packages PR
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: bash ${{ steps.version-command.outputs.path }}
          pr-title: ${{ inputs.title }}
          commit-message: ${{ inputs.commit }}
        env:
          CARGO_LOCKFILE_PATH: ${{ inputs.cargo-lockfile }}
          CARGO_MANIFEST_PATH: ${{ inputs.cargo-manifest }}
          CARGO_SYNC_SCRIPT: ${{ steps.cargo-sync.outputs.script }}
          SYNC_CARGO_INHERITED_LOCK: ${{ inputs.sync-cargo-inherited-lock }}

      - if: >-
          steps.source.outputs.current == 'true' &&
          steps.changesets.outputs.pr-number == ''
        name: Remove stale version packages PR
        shell: bash
        env:
          BASE_BRANCH: ${{ github.ref_name }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_BRANCH: changeset-release/${{ github.ref_name }}
        run: |
          set -euo pipefail
          current_sha="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_BRANCH" \
              --jq '.object.sha'
          )"
          if [[ "$current_sha" != "$GITHUB_SHA" ]]; then
            echo "::notice::Skipping stale version PR cleanup because $GITHUB_SHA is no longer the head of $BASE_BRANCH."
            exit 0
          fi

          owner="${GITHUB_REPOSITORY%%/*}"
          pr_number="$(
            gh api \
              --method GET \
              "repos/$GITHUB_REPOSITORY/pulls" \
              -f base="$BASE_BRANCH" \
              -f head="$owner:$RELEASE_BRANCH" \
              -f per_page=1 \
              -f state=open \
              --jq '.[0].number // empty'
          )"
          if [[ -n "$pr_number" ]]; then
            gh api \
              --method PATCH \
              "repos/$GITHUB_REPOSITORY/pulls/$pr_number" \
              -f state=closed \
              --silent
            echo "::notice::Closed stale version PR #$pr_number."
          fi

          if gh api \
            "repos/$GITHUB_REPOSITORY/git/ref/heads/$RELEASE_BRANCH" \
            --silent >/dev/null 2>&1; then
            gh api \
              --method DELETE \
              "repos/$GITHUB_REPOSITORY/git/refs/heads/$RELEASE_BRANCH" \
              --silent
            echo "::notice::Deleted stale branch $RELEASE_BRANCH."
          fi
