name: AI Instructions

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflow-contracts:
    name: Check shared workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - name: Test shared actions and workflows
        run: find .github -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 node --test

  sync-ai:
    name: Check generated AI instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: true
      - run: bash scripts/sync-ai-skills.sh --check
