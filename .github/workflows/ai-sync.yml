name: AI Instructions

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ (github.event_name == 'pull_request') && format('pr-{0}', github.event.pull_request.number || github.ref) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workflow-contracts:
    name: Check shared workflow contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - uses: rhysd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.1"
      - name: Test shared actions and workflows
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          find .github -type f -name '*.test.mjs' -print0 | sort -z | xargs -0 node --test
          bun test ./.github/actions/release-policy/check.test.ts ./.github/actions/quarantine-policy/check.test.ts ./.github/actions/quarantine-policy/check-lock-age.test.ts ./repo-standard/apply.test.ts
          find .github -type f -name '*_test.py' -print0 | sort -z | xargs -0 -n1 python3
      - name: Check package CLA callers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun test ./.github/tools/cla-consumers.test.ts
          bun .github/tools/cla-consumers.ts

  sync-ai:
    name: Check generated AI instructions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          submodules: true
      - run: bash scripts/sync-ai-skills.sh --check

  ci-result:
    name: ci-result
    if: always()
    needs: [workflow-contracts, sync-ai]
    runs-on: ubuntu-latest
    steps:
      - name: Check validation results
        env:
          WORKFLOW_CONTRACTS_RESULT: ${{ needs.workflow-contracts.result }}
          SYNC_AI_RESULT: ${{ needs.sync-ai.result }}
        run: |
          for result in "$WORKFLOW_CONTRACTS_RESULT" "$SYNC_AI_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Validation job concluded with result: $result"
              exit 1
            fi
          done
