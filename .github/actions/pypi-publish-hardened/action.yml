name: Hardened PyPI publish
description: Validate and publish an exact, pre-built wheel set with PyPI OIDC.

inputs:
  artifact-pattern:
    description: Artifact pattern containing one wheel per artifact directory.
    required: false
    default: python-wheel-*
  expected-version:
    description: Stella semver from the caller's verified VERSION file.
    required: true
  project-name:
    description: Exact Python project name from wheel METADATA.
    required: true
  distribution-name:
    description: Exact underscore-normalized wheel filename prefix.
    required: true
  wheel-contract:
    description: JSON object mapping artifact names to exact platform tag arrays.
    required: true
  skip-existing:
    description: Permit safe recovery after a partially completed immutable upload.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Download wheel artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        pattern: ${{ inputs.artifact-pattern }}
        path: wheel-artifacts
    - name: Validate exact wheel set
      shell: bash
      env:
        DISTRIBUTION_NAME: ${{ inputs.distribution-name }}
        EXPECTED_VERSION: ${{ inputs.expected-version }}
        PROJECT_NAME: ${{ inputs.project-name }}
        WHEEL_CONTRACT: ${{ inputs.wheel-contract }}
      run: >-
        python3 "${{ github.action_path }}/validate_wheels.py"
        wheel-artifacts dist
    - name: Publish wheels to PyPI
      uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: dist
        skip-existing: ${{ inputs.skip-existing }}
