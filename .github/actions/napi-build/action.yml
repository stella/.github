name: NAPI build
description: Install dependencies and build a native, cross-compiled, or WASM binding
inputs:
  target:
    required: true
  kind:
    required: true
  toolchain:
    required: false
    default: 1.99.0
  node-version:
    required: false
    default: "22"
  install-command:
    required: false
    default: bun install --frozen-lockfile --no-verify
  cache:
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
      with:
        node-version: ${{ inputs.node-version }}
    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
      with:
        toolchain: ${{ inputs.toolchain }}
        targets: ${{ inputs.target }}
    - run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      shell: bash
    - if: inputs.cache == 'true'
      uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      with:
        shared-key: build-${{ inputs.target }}-${{ inputs.toolchain }}
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
    - run: ${{ inputs.install-command }}
      shell: bash
    - if: inputs.kind == 'native'
      run: bun run build --target ${{ inputs.target }}
      shell: bash
    - if: inputs.kind == 'cross'
      run: bun run build --target ${{ inputs.target }} --use-napi-cross
      shell: bash
    - if: inputs.kind == 'wasm'
      run: bun run build:wasm
      shell: bash
